[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-arb-contest"
version = "0.1.0"
description = "Causal spot–spot arbitrage competition evaluator"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
parquet = ["pyarrow>=14,<23"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
spot-contest = "spot_contest.cli:main"

[tool.setuptools.packages.find]
include = ["spot_contest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
