name: Check evaluator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements.lock -e .
      - run: python -m unittest discover -s tests -v
      - run: docker build -f Dockerfile.strategy -t spot-contest-strategy:0.1.0 .
      - run: python -m spot_contest demo --output data/ci-demo
      - run: >-
          python -m spot_contest evaluate
          --config data/ci-demo/config.json --data data/ci-demo/events.jsonl
          --submission examples/baseline --output runs/ci-docker
      - name: Check Docker baseline score
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          scores = json.loads(Path('runs/ci-docker/scores.json').read_text(), parse_float=Decimal)
          assert scores['score'] == Decimal('0.00002528435'), scores
          assert scores['net_pnl'] == Decimal('2.528435'), scores
          assert scores['filled_orders'] == 26, scores
          PY
